# MeshCore node configuration.
#
# Read once at startup into a struct; nothing here is consulted on a hot path.
# Every value below is the built-in default, so an empty file behaves the same
# as this one. Keys not listed here are not read by the node.
#
#   meshcore-node [path/to/meshcore.ini]
#
# The file holds passwords in the clear, so keep it at mode 0600.

[node]
# Where the identity key, contacts and room state live. Created with mode 0700.
dir = ./data

# Goes into the advert appdata as the node name; empty means no name field.
name = room

# State is written lazily, on this timer, and once more at shutdown. Never per
# advert: they arrive constantly, and a synchronous write for each would stall
# the node and wear out an SD card.
flush_ms = 60000

# How often we announce ourselves. Too often is a duty cycle problem for the
# whole neighbourhood, not just for us.
advert_ms = 300000

[log]
# error | warn | info | debug
#
# Keep this at info in production. Roughly one foreign packet in 256 lands here
# and fails to decrypt because the destination hash is one byte wide; that is
# normal protocol behaviour, it is logged at debug, and at debug on a busy
# network the log becomes unreadable.
level = info

[radio]
# virtual | udp
#
#   virtual  the medium lives inside this process, so two running nodes never
#            hear each other. Useful only to check that the stack comes up.
#   udp      datagrams to the peers listed below. Several processes on one
#            machine, or several machines on a LAN, form a real network.
#
# The SX1262 driver does not exist yet; when it does it becomes a third value
# here and nothing else changes.
driver = virtual

# udp only. Each node lists the peers it can hear, so the peer lists *are* the
# visibility matrix: a chain A-R-C is three configs, not a special mode. A node
# nobody lists is heard by nobody, which is how you switch a repeater off.
#
#   udp_port  = 45601
#   udp_peers = 127.0.0.1:45602, 127.0.0.1:45603
#
# Or, where the host has a multicast route, one group instead of peer lists:
#
#   udp_group = 239.255.42.1
#   udp_group_port = 4242
udp_bind = 127.0.0.1
udp_port = 0
udp_peers =
udp_group =
udp_group_port = 4242

# These must match the rest of the network bit for bit. One wrong field and the
# node simply hears nobody, with no error message anywhere.
frequency = 869525000
spreading_factor = 11
bandwidth = 62500
coding_rate = 5

# Percent of a sliding hour we may spend transmitting. 10 is the EU 868 MHz
# limit; the budget is measured in real airtime, and exceeding it is a
# regulatory breach rather than a bit of extra traffic. With a one-watt
# amplifier this runs out faster than it sounds.
duty_cycle = 10

[room]
# Empty means that level cannot be reached at all: with no admin_password
# nobody gets admin, which is the safe default for an unattended node.
admin_password =
guest_password =

# Let a client in with read-only rights when the password matches nothing.
anonymous_read = false

[telemetry]
# The off switch. With this false the bus is never handed to routing or room,
# they publish nowhere, and everything else runs unchanged.
enabled = true

# Ring buffer depth. When the consumer falls behind, events are dropped on
# purpose — telemetry may not stall packet handling or blow an ack deadline.
# The drop count is itself a metric.
queue = 256

# How often counters are drained and logged.
report_ms = 60000
